
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | My Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #100d2b, #292052);
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #292052;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #292052;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #443582;
        }

        .error {
            color: #b91c1c;
            text-align: center;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #292052;
        }
    </style>
</head>
<body>
    <main class="login-box">
        <h1>Admin Login</h1>
        <p>Sign in to view your portfolio messages.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="{{ category }}" role="alert">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Log In</button>
        </form>

        <a class="back-link" href="{{ url_for('home') }}">
            Back to Portfolio
        </a>
    </main>
</body>
</html>
